[project]
name = "cyshield-task"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.0.1",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.142.2",
    "groq>=1.7.0",
    "ipykernel>=7.3.0",
    "joblib>=1.4.2",
    "jupyterlab>=4.6.4",
    "langchain>=1.4.3",
    "langgraph>=1.2.12",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openai>=3.20.0",
    "pandas>=3.0.6",
    "peft>=0.21.2",
    "psutil>=7.2.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "scikit-learn==1.6.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.1.0",
    "uvicorn>=0.54.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
